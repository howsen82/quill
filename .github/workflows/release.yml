name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version. Examples: "2.0.0", "2.0.0-beta.0". To deploy an experimental version, type "experimental".'
        default: "experimental"
        required: true
      dry-run:
        description: "Only create a tarball, do not publish to npm or create a release on GitHub."
        type: boolean
        default: true
        required: true
      skip-npm:
        description: "Do not publish to npm. Still tags, builds the tarball and creates the GitHub release."
        type: boolean
        default: false
        required: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  release:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: ./scripts/release.js --version ${{ github.event.inputs.version }} ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }} ${{ github.event.inputs.skip-npm == 'true' && '--skip-npm' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Archive npm package tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm
          path: |
            packages/quill/dist/*.tgz
